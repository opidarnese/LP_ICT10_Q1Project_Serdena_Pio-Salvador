<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SKU Generator</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.2.1/core.js"></script>

  <style>
    body {
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode',
        'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

      background: url('images.jpg') no-repeat center center fixed;
      background-size: cover;

      margin: 0;
      padding: 0;
    }

    header {
      background: rgba(0, 0, 255, 0.8);
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: rgba(0, 0, 100, 0.9);
      text-align: center;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 5px;

      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;

      background: rgba(0, 125, 200);
      color: white;

      border: none;
      border-radius: 6px;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #602104;
    }

    .output {
      margin-top: 20px;
      padding: 15px;

      border: 1px solid #ddd;
      border-radius: 6px;

      background: #fafafa;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

    <button py-click="SKU_generator">
    Generate SKU
    </button>

  <header>
    <h1>SKU Generator</h1>
    <p>Create a unique product SKU</p>
  </header>

  <nav>
    <a href="index.html">Receipt Generator</a>
    <a href="sku.html">SKU Generator</a>
  </nav>

  <div class="container">

    <h2>Generate SKU</h2>

    <label for="category">Product Category</label>
    <input
      type="text"
      id="category"
      placeholder="Example: Stolen weapons"
    >

    <label for="product_name">Product Name</label>
    <input
      type="text"
      id="product_name"
      placeholder="Example: katana"
    >

    <label for="quantity">Stock Quantity</label>
    <input
      type="number"
      id="quantity"
      min="0"
      placeholder="Example: 5"
    >

    <button py-click="SKU_generator">
      Generate SKU
    </button>

    <div class="output" id="sku_output"></div>

  </div>

  <script type="py" src="./main.py"></script>

</body>

</html>
